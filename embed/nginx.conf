worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml font/ttf font/otf application/font-woff application/font-woff2;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        autoindex off;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /dist/v3dist/manifest.json {
            alias /usr/share/nginx/html/dist/v3dist/manifest.json;
            add_header Cache-Control "public, max-age=60";
        }

        location = /dist/v3dist/manifest.locale.json {
            alias /usr/share/nginx/html/dist/v3dist/manifest.locale.json;
            add_header Cache-Control "public, max-age=60";
        }

        # 4.1.5 宿主路径：带 hash 的静态文件可长期缓存
        location /dist/v3dist/ {
            alias /usr/share/nginx/html/dist/v3dist/;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # 4.3.0 扩展静态前缀，同一份文件
        location /extensions-static/ks-console-embed/ {
            alias /usr/share/nginx/html/;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            return 404;
        }
    }
}
