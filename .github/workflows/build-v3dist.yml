name: Build ks-console-embed

on:
  push:
    branches:
      - main
      - release-4.1.5
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - release-4.1.5
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 使用 Node.js 14
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: 安装依赖
        run: yarn install --frozen-lockfile

      - name: 构建 V3 静态资源
        env:
          V3_PUBLIC_PATH: /dist/v3dist/
        run: yarn build:client

      - name: 写入制品元数据
        env:
          V3_REF: ${{ github.ref_name }}
          V3_SHA: ${{ github.sha }}
        run: |
          cat > dist/.v3dist-source.json <<EOF
          {"schemaVersion":1,"repository":"mysStack/ks-console-embed","ref":"${V3_REF}","commit":"${V3_SHA}"}
          EOF

      - name: 打包 V3 制品
        env:
          V3_REF: ${{ github.ref_name }}
        run: |
          safe_ref="${V3_REF//\//-}"
          tar -czf "console-v3dist-${safe_ref}.tar.gz" -C dist .

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: console-v3dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: 生成镜像标签
        id: image_tag
        run: |
          source_ref='${{ github.ref_name }}'
          ref_tag="$(printf '%s' "$source_ref" | tr '/_' '--' | tr -cs '[:alnum:].-' '-' | sed 's/^-*//; s/-*$//')"
          timestamp="$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)"
          commit_id="$(git rev-parse --short=12 HEAD)"
          echo "value=${ref_tag}-${timestamp}-${commit_id}" >> "$GITHUB_OUTPUT"

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 ks-console-embed 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: embed/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/mysstack/ks-console-embed:${{ steps.image_tag.outputs.value }}
            ghcr.io/mysstack/ks-console-embed:${{ github.sha }}

      - name: 发布版本制品
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: console-v3dist-${{ github.ref_name }}.tar.gz
